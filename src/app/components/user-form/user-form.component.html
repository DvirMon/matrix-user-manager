<form [formGroup]="userForm()" class="user-form">
  <div class="form-row">
    <mat-form-field class="form-field" appearance="fill">
      <mat-label>First Name</mat-label>
      <input matInput autocomplete="off" formControlName="firstName"  />
      <mat-error>
        {{ errors["firstName"]() }}
      </mat-error>
    </mat-form-field>

    <mat-form-field class="form-field" appearance="fill">
      <mat-label>Last Name</mat-label>
      <input matInput autocomplete="off" formControlName="lastName"  />
      <mat-error>
        {{ errors["lastName"]() }}
      </mat-error>
    </mat-form-field>
  </div>

  <div class="form-row">
    <mat-form-field class="form-field" appearance="fill">
      <mat-label>Age</mat-label>
      <input
        matInput
        autocomplete="off"
        type="number"
        formControlName="age"
         />
      <mat-error>
        {{ errors["age"]() }}
      </mat-error>
    </mat-form-field>

    <mat-form-field class="form-field" appearance="fill">
      <mat-label>Gender</mat-label>
      <mat-select formControlName="gender" >
        <mat-option value="female">Female</mat-option>
        <mat-option value="male">Male</mat-option>
        <mat-option value="other">Other</mat-option>
      </mat-select>
      <mat-error>
        {{ errors["gender"]() }}
      </mat-error>
    </mat-form-field>
  </div>

  <div class="form-row">
    <mat-form-field class="form-field" appearance="fill">
      <mat-label>Country</mat-label>
      <input
        matInput
        type="text"
        autocomplete="new-password"
        formControlName="country"
        [matAutocomplete]="auto"
        (input)="onCountryChanged($event)"
        appOptionValidation
        [list]="options()"
         />
      <mat-autocomplete #auto="matAutocomplete">
        @for (country of options(); track country) {
        <mat-option [value]="country">
          {{ country }}
        </mat-option>
        }
      </mat-autocomplete>
      <mat-error>
        {{ errors["country"]() }}
      </mat-error>
    </mat-form-field>

    <mat-form-field class="form-field" appearance="fill">
      <mat-label>City</mat-label>
      <input
        matInput
        autocomplete="new-password"
        formControlName="city"
         />
      <mat-error>
        {{ errors.city() }}
      </mat-error>
    </mat-form-field>
  </div>

  <div class="form-actions">
    <button mat-button type="button" (click)="onCancel()">Close</button>
    <button mat-raised-button color="primary" (click)="onSave()">Save</button>
  </div>
</form>

<!-- [disabled]="userForm.invalid || userForm.pristine" -->
